<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
<title>그리움</title>
<meta name="description" content="누구에게나 그리운 사람이 있습니다 · 엄마, 아내, 가족, 친구… 마음속 그리움을 따뜻하게 담아보세요">
<meta property="og:title" content="그리움">
<meta property="og:description" content="누구에게나 그리운 사람이 있습니다. 마음속 그리움을 따뜻하게 담아보세요.">
<meta name="theme-color" content="#fbf3f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="그리움">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>(function(){try{var u=navigator.userAgent||'';if(/KAKAOTALK/i.test(u)){location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href)}}catch(e){}})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Pen+Script&family=Nanum+Brush+Script&display=swap">
<style>
:root{--bg:#fbf3f0;--card:#fffaf8;--ink:#4a2a2e;--body:#6e5054;--muted:#9a8285;--rose:#b86a75;--rose2:#d9939d;--rose3:#f3dcdc;--line:#efdcd8;--gold:#c9a36a;
--fh:'Gowun Batang','Nanum Myeongjo',serif;--fb:'Noto Sans KR',system-ui,-apple-system,sans-serif;--fp:'Nanum Pen Script',cursive;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--fb);color:var(--ink);font-size:15px;line-height:1.6;background:#2b1b1e;overflow:hidden;word-break:keep-all}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:clip}
@media(min-width:700px){body{background:radial-gradient(70% 80% at 50% 30%,#6b4249,#22151a 75%);display:flex;align-items:center;justify-content:center}
 #app{height:min(920px,96vh);border-radius:32px;box-shadow:0 30px 80px rgba(0,0,0,.5);border:6px solid #1a1012}}
.side{display:none;position:fixed;inset:0;pointer-events:none;align-items:center;justify-content:space-between;padding:0 5vw}
@media(min-width:1150px){.side{display:flex}}
.side div{max-width:24vw;color:#f6dfe0}
.side h2{font-family:var(--fh);font-size:clamp(28px,3vw,46px);line-height:1.25}
.side p{margin-top:14px;font-size:15.5px;color:#dbbec1;line-height:1.8}
/* header */
header{flex:none;display:none;align-items:center;gap:4px;height:calc(54px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 6px 0;background:rgba(251,243,240,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:20}
header.on{display:flex}
header .ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
header .ib svg{width:24px;height:24px}
header h1{flex:1;text-align:center;font-family:var(--fh);font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.vw{display:none;padding-bottom:24px}.vw.on{display:block}
/* home */
.hero{position:relative;padding-top:env(safe-area-inset-top,0px);background:#f7e1dc}
.hero img{width:100%;height:auto}
.hero .ic{position:absolute;right:8px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:2px}
.hero .ic button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.hero .ic svg{width:21px;height:21px}
.hcards{position:relative;margin-top:-18px;padding:12px 8px 0;border-radius:24px 24px 0 0;background:var(--bg);display:grid;grid-template-columns:1fr 1fr;gap:9px}
.hcards button{border-radius:16px;overflow:hidden;box-shadow:0 6px 16px rgba(120,60,60,.14);transition:transform .15s}
.hcards button:active{transform:scale(.97)}
.blk{margin:18px 12px 0}
.ttl{display:flex;align-items:center;margin-bottom:10px}
.ttl h3{font-family:var(--fh);font-size:19px;font-weight:700}
.ttl button{margin-left:auto;font-size:13.5px;color:var(--muted);font-weight:500}
.quote{position:relative;padding:20px 18px 18px;border-radius:18px;background:linear-gradient(150deg,#fff6f2,#f8e3df);border:1px solid var(--line);text-align:center}
.quote small{font-size:12.5px;color:var(--rose);font-weight:700;letter-spacing:2px}
.quote p{margin-top:6px;font-family:var(--fh);font-size:18.5px;line-height:1.6;color:var(--ink)}
.quote span{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.quote button{position:absolute;right:10px;top:10px;width:34px;height:34px;color:var(--rose)}
/* generic cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 14px rgba(120,60,60,.06)}
.ph{position:relative;height:150px;overflow:hidden;display:flex;align-items:flex-end}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,250,248,0) 30%,rgba(251,243,240,.96))}
.ph div{position:relative;z-index:1;padding:0 16px 10px}
.ph h2{font-family:var(--fh);font-size:24px;font-weight:700}
.ph p{font-size:13.5px;color:var(--body)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:50px;border-radius:14px;font-weight:700;font-size:16px;width:100%}
.btn.p{background:linear-gradient(180deg,#c97a85,#a85d68);color:#fff;box-shadow:0 6px 16px rgba(168,93,104,.3)}
.btn.l{background:var(--rose3);color:var(--ink)}
.btn.o{border:1.5px solid var(--rose2);color:var(--rose)}
.btn svg{width:20px;height:20px}
.pad{padding:0 12px}
.empty{margin:16px 12px 0;padding:28px 18px;text-align:center;border-radius:18px;border:1.5px dashed var(--rose2);color:var(--body);font-size:14.5px}
.empty b{display:block;font-family:var(--fh);font-size:18px;color:var(--ink);margin-bottom:4px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--rose3);color:var(--rose);font-size:12.5px;font-weight:700}
.ex{display:inline-block;padding:1px 7px;border-radius:6px;background:#efe6e4;color:var(--muted);font-size:12px;font-weight:700;margin-left:4px;vertical-align:middle}
/* people */
.pl{display:flex;flex-direction:column;gap:10px;padding:12px}
.pc{display:flex;align-items:center;gap:14px;padding:14px;text-align:left;width:100%}
.av{flex:none;width:62px;height:62px;border-radius:50%;overflow:hidden;background:linear-gradient(150deg,#f3d4d4,#e8b8bd);display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:24px;font-weight:700;color:#fff;border:3px solid #fff;box-shadow:0 3px 10px rgba(120,60,60,.15)}
.av img{width:100%;height:100%;object-fit:cover}
.pc .tx{flex:1;min-width:0}
.pc b{font-family:var(--fh);font-size:19px}.pc small{display:block;font-size:13px;color:var(--muted)}
.pc .ln{font-size:13.5px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .dd{flex:none;text-align:center;font-size:12px;color:var(--muted)}.pc .dd b{display:block;font-family:var(--fb);font-size:16px;color:var(--rose)}
.pd{padding:20px 16px 0;text-align:center}
.pd .av{width:104px;height:104px;margin:0 auto;font-size:40px}
.pd h2{margin-top:10px;font-family:var(--fh);font-size:26px}
.pd .one{margin-top:6px;font-family:var(--fp);font-size:24px;color:var(--rose);line-height:1.3}
.pd .st{display:grid;grid-template-columns:repeat(3,1fr);margin:14px 0 0;padding:12px 0}
.pd .st div+div{border-left:1px solid var(--line)}
.pd .st b{display:block;font-size:19px;color:var(--rose)}.pd .st small{font-size:12.5px;color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 12px 0}
.acts button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:700}
.acts svg{width:24px;height:24px;color:var(--rose)}
.tl{margin:12px;padding:6px 14px}
.tl .it{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.tl .it:last-child{border:0}
.tl .k{flex:none;width:36px;height:36px;border-radius:50%;background:var(--rose3);color:var(--rose);display:flex;align-items:center;justify-content:center}
.tl .k svg{width:18px;height:18px}
.tl b{font-size:14.5px}.tl p{font-size:13.5px;color:var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.tl small{font-size:12.5px;color:var(--muted)}
.tl .th{flex:none;width:52px;height:52px;border-radius:10px;object-fit:cover;margin-left:auto}
/* letters */
.poster{position:relative;overflow:hidden}
.poster img{width:100%;height:auto}
.poster:after{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(180deg,transparent,var(--bg))}
.poster .cap{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;display:flex;gap:8px}
.lt{display:flex;flex-direction:column;gap:10px;padding:12px}
.lc{position:relative;padding:16px 16px 32px;text-align:left;width:100%;overflow:hidden}
.lc:before{content:"";position:absolute;right:-8px;top:-8px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle,#c4565f 0 38%,transparent 40%);opacity:.18}
.lc small{font-size:12.5px;color:var(--muted)}
.lc b{display:block;margin-top:2px;font-family:var(--fh);font-size:17px}
.lc p{margin-top:4px;font-size:14px;color:var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lc .sk{position:absolute;right:14px;bottom:12px;font-size:12px;color:var(--rose);font-weight:700}
.paper{margin:12px;padding:26px 22px 24px;border-radius:6px;min-height:380px;font-family:var(--fp);font-size:26px;line-height:1.55;color:#3a2326;white-space:pre-wrap;box-shadow:0 10px 26px rgba(120,60,60,.16);position:relative;background-size:cover}
.paper .to{font-size:28px;margin-bottom:10px}
.paper .fr{margin-top:18px;text-align:right}
.paper .dt{font-family:var(--fb);font-size:13px;color:#8a6a6d;text-align:right}
.pp0{background:repeating-linear-gradient(#fffaf6 0 37px,#f0d9d4 37px 38px);background-position:0 18px}
.pp1{background:linear-gradient(180deg,rgba(255,247,240,.92),rgba(255,236,226,.92)),linear-gradient(160deg,#f7c6a9,#e8a3b0)}
.pp2{background:linear-gradient(180deg,rgba(255,248,238,.93),rgba(252,238,224,.93)),linear-gradient(160deg,#d9532e,#f0b36b)}
.ppk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ppk button{height:60px;border-radius:10px;border:2px solid transparent;font-size:13.5px;font-weight:700;color:#5a3a3e}
.ppk button.on{border-color:var(--rose)}
.fly{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle at 50% 40%,#fff3ee,#f3d1cf 70%);pointer-events:none;opacity:0;transition:opacity .3s}
.fly.on{opacity:1}
.fly .env{width:120px;height:84px;position:relative;animation:upfly 2.2s ease-in .2s forwards}
.fly p{margin-top:24px;font-family:var(--fh);font-size:20px;color:var(--ink);text-align:center;line-height:1.6;animation:fade 2.4s ease forwards}
@keyframes upfly{0%{transform:translateY(0) scale(1)}30%{transform:translateY(10px) rotate(-4deg)}100%{transform:translateY(-70vh) scale(.4) rotate(8deg);opacity:0}}
@keyframes fade{0%{opacity:0}30%{opacity:1}100%{opacity:1}}
/* album */
.ag{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px}
.ag button{position:relative;aspect-ratio:1;overflow:hidden;border-radius:6px;background:#efe0dd}
.ag img{width:100%;height:100%;object-fit:cover}
.ag .x{position:absolute;left:6px;bottom:4px;font-size:12px;color:#fff;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.ag .add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed var(--rose2);background:var(--card);color:var(--rose);font-size:13px;font-weight:700}
.ag .add svg{width:28px;height:28px}
.pv{background:#1e1214;min-height:100%;display:flex;flex-direction:column}
.pv img{width:100%;max-height:65vh;object-fit:contain;background:#1e1214}
.pv .cp{padding:16px;color:#f6e6e6}
.pv .cp b{font-family:var(--fh);font-size:19px}.pv .cp p{margin-top:4px;font-size:14.5px;color:#d8c4c6}.pv .cp small{font-size:12.5px;color:#a88e91}
/* diary */
.dh{display:flex;gap:8px;overflow-x:auto;padding:12px;scrollbar-width:none}.dh::-webkit-scrollbar{display:none}
.dh div{flex:none;width:46px;padding:8px 0;border-radius:14px;text-align:center;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.dh div b{display:block;font-size:16px;color:var(--ink)}
.dh div.on{background:var(--rose);border-color:var(--rose);color:#fff}.dh div.on b{color:#fff}
.dh div i{display:block;width:6px;height:6px;border-radius:50%;margin:3px auto 0;background:transparent}
.dh div.w i{background:var(--rose2)}.dh div.on.w i{background:#fff}
.strk{margin:0 12px;display:flex;align-items:center;gap:12px;padding:14px 16px}
.strk b{font-family:var(--fh);font-size:28px;color:var(--rose)}.strk p{font-size:14px;color:var(--body)}
.dl{display:flex;flex-direction:column;gap:10px;padding:12px}
.dc{padding:14px 16px;text-align:left;width:100%}
.dc .h{display:flex;align-items:center;gap:8px}
.dc .h small{margin-left:auto;font-size:12.5px;color:var(--muted)}
.dc p{margin-top:6px;font-family:var(--fp);font-size:23px;line-height:1.4;color:#3a2326}
.moods{display:flex;flex-wrap:wrap;gap:6px}
.moods button{padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:500}
.moods button.on{background:var(--rose);border-color:var(--rose);color:#fff}
/* share */
.chips{position:sticky;top:0;z-index:3;display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:rgba(251,243,240,.96);scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:700;color:var(--body)}
.chips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.feat{position:relative;margin:4px 12px 0;border-radius:18px;overflow:hidden;height:190px;text-align:left;width:calc(100% - 24px);display:block}
.feat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.feat:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(60,25,40,.65),transparent 70%)}
.feat div{position:absolute;left:16px;bottom:14px;z-index:1;color:#fff}
.feat small{font-size:12.5px;font-weight:700;letter-spacing:1px;opacity:.9}
.feat b{display:block;font-family:var(--fh);font-size:22px}
.feat p{font-size:13.5px;opacity:.92}
.sl{display:flex;flex-direction:column;gap:10px;padding:12px}
.sp{padding:16px;text-align:left;width:100%}
.sp .h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sp .h .tag{margin-right:2px}
.sp b{display:block;margin-top:8px;font-family:var(--fh);font-size:17.5px;line-height:1.45}
.sp p{margin-top:4px;font-size:14.5px;color:var(--body);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sp .f{display:flex;gap:14px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.sp .f span{display:flex;align-items:center;gap:4px}.sp .f svg{width:17px;height:17px}
.sp .f .on{color:var(--rose);font-weight:700}
.sd{padding:18px 16px}
.sd b{font-family:var(--fh);font-size:21px;line-height:1.45}
.sd .bd{margin-top:10px;font-size:15.5px;line-height:1.85;color:var(--body);white-space:pre-wrap}
.rx{display:flex;gap:8px;margin-top:16px}
.rx button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14.5px;color:var(--body)}
.rx button.on{border-color:var(--rose);background:var(--rose3);color:var(--rose)}
.rx svg{width:19px;height:19px}
.cm{margin:12px;padding:6px 16px}
.cm div{padding:12px 0;border-bottom:1px solid var(--line)}.cm div:last-child{border:0}
.cm b{font-size:13.5px}.cm small{font-size:12px;color:var(--muted);margin-left:6px}.cm p{font-size:14.5px;color:var(--body);margin-top:2px}
.ci{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 12px;background:rgba(251,243,240,.96);border-top:1px solid var(--line)}
.ci input{flex:1;min-width:0;padding:11px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff}
.ci button{flex:none;padding:0 16px;border-radius:999px;background:var(--rose);color:#fff;font-weight:700}
.wfab{position:absolute;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;display:none;align-items:center;gap:6px;height:50px;padding:0 20px;border-radius:999px;background:linear-gradient(180deg,#c97a85,#a85d68);color:#fff;font-weight:700;box-shadow:0 8px 20px rgba(168,93,104,.4)}
.wfab.on{display:flex}.wfab svg{width:20px;height:20px}
/* my */
.myh{position:relative;margin:12px;padding:20px 16px;border-radius:20px;overflow:hidden;color:#fff;background:linear-gradient(150deg,#c27d87,#8f5560)}
.myh img{position:absolute;right:-10px;top:-10px;width:150px;height:170px;object-fit:cover;opacity:.55;border-radius:20px;-webkit-mask-image:linear-gradient(270deg,#000 40%,transparent);mask-image:linear-gradient(270deg,#000 40%,transparent)}
.myh small{position:relative;font-size:13px;opacity:.9}.myh b{position:relative;display:block;font-family:var(--fh);font-size:24px}
.myh p{position:relative;margin-top:6px;font-size:13.5px;opacity:.95;max-width:65%}
.ms{display:grid;grid-template-columns:repeat(4,1fr);margin:0 12px}
.ms button{padding:14px 2px;text-align:center}.ms button+button{border-left:1px solid var(--line)}
.ms b{display:block;font-size:20px;color:var(--rose)}.ms small{font-size:12.5px;color:var(--muted)}
.mn{margin:12px;overflow:hidden}
.mn button{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;border-bottom:1px solid var(--line);text-align:left;font-size:15px;font-weight:500}
.mn button:last-child{border:0}.mn svg{width:21px;height:21px;color:var(--rose);flex:none}
.mn span{margin-left:auto;font-size:13px;color:var(--muted)}
.mn button:after{content:"›";color:#c5aeb1;font-size:20px}
.help{margin:12px;padding:14px 16px;border-radius:16px;background:#f6ebe9;font-size:13.5px;color:var(--body);line-height:1.7}
.help b{color:var(--ink)}
/* bottom nav */
nav.bn{flex:none;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:#fdf6f4;border-top:1px solid var(--line);z-index:20}
nav.bn button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:58px;border-radius:16px;font-size:13px;font-weight:700;color:var(--ink)}
nav.bn svg{width:25px;height:25px}
nav.bn button.on{background:linear-gradient(180deg,#d4949c,#bf7782);color:#fff}
/* sheet */
.ov{position:absolute;inset:0;z-index:50;background:rgba(40,20,25,.45);opacity:0;visibility:hidden;transition:opacity .2s}
.ov.on{opacity:1;visibility:visible}
