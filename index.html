.pf .t{display:flex;align-items:center;gap:14px}.pf .t>div{flex:1;min-width:0}.pf h2{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:900;letter-spacing:-.05em}.pf h2 svg{width:18px;height:18px;color:#4aa3ff;fill:#4aa3ff;stroke:#fff;stroke-width:2.4}

.mn{margin:12px 12px 0;border-radius:16px;background:#fff;box-shadow:var(--card);overflow:hidden}.mn button{display:flex;align-items:center;gap:11px;width:100%;padding:14px;text-align:left;font-size:15px;font-weight:700}.mn button+button{border-top:1px solid #f0f2f7}
.mn i{flex:none;width:36px;height:36px;border-radius:11px;background:#eaf1ff;color:var(--bl);display:flex;align-items:center;justify-content:center}.mn i svg{width:20px;height:20px}.mn span{flex:1}.mn em{font-style:normal;font-size:13px;color:var(--mu)}.mn u{text-decoration:none;color:#a3aabb;font-size:18px}
.vcard{display:flex;align-items:center;gap:12px;margin:12px 12px 0;padding:14px;border-radius:16px;background:linear-gradient(110deg,#fff7d6,#ffefb0);box-shadow:inset 0 0 0 1px #f2d97a}.vcard>div{flex:1}.vcard b{font-size:15.5px;font-weight:900;color:#5c3d00}.vcard small{display:block;font-size:12.5px;color:#7a5a20;margin-top:2px}
.foot{margin:24px 16px 0;font-size:12.5px;color:#8a92a8;line-height:1.7;text-align:center}.foot b{display:block;font-size:14px;color:#4b5268}
/* footer */
footer{flex:none;display:flex;background:linear-gradient(180deg,#0c2858,#081d45);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.nb{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:#fff}.nb svg{width:26px;height:26px;stroke-width:2.1}.nb span{font-size:13px;font-weight:700;letter-spacing:-.05em;white-space:nowrap}
.nb.on{color:var(--yl)}.nb.on span{font-weight:900}/* overlays */
.ov{position:fixed;inset:0;z-index:70;background:rgba(8,18,45,.5);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}.ov.on{opacity:1;pointer-events:auto}

.shH{flex:none;display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}.shH h3{font-size:18px;font-weight:900}.shH button{width:34px;height:34px;border-radius:50%;background:#f2f5fa;font-size:16px;color:#4b5268}

.cm1{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid #f0f2f7}.cm1>div{flex:1;min-width:0}.cm1 b{font-size:14px;font-weight:900}.cm1 small{font-size:12px;color:var(--mu);margin-left:5px}.cm1 p{margin-top:2px;font-size:14.5px;line-height:1.55;color:#3a4260}
.cmi{display:flex;gap:6px;margin-top:10px}.cmi input{flex:1;min-width:0;height:46px;border:1.5px solid #dbe1ec;border-radius:23px;padding:0 15px;font-size:16px;outline:0}.cmi button{flex:none;padding:0 16px;border-radius:23px;background:var(--nv);color:#fff;font-size:14.5px;font-weight:900}
.sb{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:14px;background:#f2f5fa;box-shadow:inset 0 0 0 1.5px var(--ln)}.sb svg{width:20px;height:20px;color:var(--mu)}.sb input{flex:1;min-width:0;border:0;background:none;font-size:16px;outline:0}
.dl{position:fixed;inset:0;z-index:90;background:rgba(8,18,45,.55);display:none;align-items:center;justify-content:center;padding:24px}.dl.on{display:flex}

.dl b{display:block;font-size:19px;font-weight:900}.dl p{margin-top:8px;font-size:15px;line-height:1.6;color:#3d4560}.dl .bb{display:flex;gap:8px;margin-top:16px}.dl .bb button{flex:1;padding:13px;border-radius:13px;font-size:15.5px;font-weight:900}.dl .n{background:#eef1f7;color:#4b5268}.dl .y{background:var(--nv);color:#fff}
.dw{position:fixed;inset:0;z-index:80;background:rgba(8,18,45,.5);opacity:0;pointer-events:none;transition:opacity .25s}.dw.on{opacity:1;pointer-events:auto}
.dwI{position:absolute;right:0;top:0;bottom:0;width:min(84%,340px);background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:20px}.dw.on .dwI{transform:none}
.dwH{display:flex;align-items:center;gap:10px;padding:16px 14px;padding-top:calc(16px + env(safe-area-inset-top));background:linear-gradient(160deg,#0c2858,#123a7a);color:#fff}.dwH img{height:36px}.dwH>div{flex:1}.dwH small{font-size:12.5px;color:#c9d6f2}.dwH>button{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff}
.dwK{margin:16px 16px 6px;font-size:13px;font-weight:900;color:#7a8196}.dwI .mn{margin-top:0}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:99;max-width:90%;background:rgba(10,20,50,.94);color:#fff;font-size:14px;font-weight:700;padding:11px 18px;border-radius:22px;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center}
#toast.on{opacity:1}
.ld{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 0}.ld i{width:38px;height:38px;border-radius:50%;border:4px solid #e3e8f1;border-top-color:var(--bl);animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.ld b{font-size:15px}
.bk.on~.hsub{display:none}.hsub{white-space:nowrap}
.bk.on~.lg img{height:36px}
svg.vf{width:15px!important;height:15px!important;color:var(--bl);fill:var(--bl)!important;stroke:#fff!important;stroke-width:2.4;vertical-align:-2px;margin-left:2px}

.pdw{padding:18px 16px;background:#fff}.pdw h1{margin-top:16px;font-size:20px;font-weight:900;letter-spacing:-.05em;line-height:1.4}.pdw .ds{margin-top:10px;font-size:16px;line-height:1.75;color:#262e48;white-space:pre-line}.pdw .hs{color:var(--bl);font-weight:700}

.pda{display:flex;gap:6px;margin-top:16px}.pda button{display:flex;align-items:center;gap:4px;padding:8px 13px;border-radius:20px;box-shadow:inset 0 0 0 1px #e1e5ed;font-size:14px;font-weight:700;color:#4b5268}.pda svg{width:18px;height:18px}.pda .on{color:#ef2b5a;box-shadow:inset 0 0 0 1.5px #ef2b5a}.pda .on svg{fill:#ef2b5a;stroke:#ef2b5a}
.fmini{display:block;width:100%;margin-top:12px;padding:12px;border-radius:12px;background:#eefaf4;text-align:left}.fmini b{display:block;font-size:15px;font-weight:900;color:#0b6e49}.fmini span{font-size:13px;color:#3d6a57}
.cpp{flex:none;display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:#fff;border-bottom:1px solid #e6e9f0;text-align:left}.cpp img{width:44px;height:44px;border-radius:8px;object-fit:cover}.cpp div{flex:1;min-width:0}.cpp b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cpp small{font-size:13px;font-weight:900}.cpp .st{padding:4px 9px;font-size:12px}
/* 프로필 */

.pfc .tpb{width:100%;align-items:stretch}.pfc .tpb b{font-size:20px}.pfc .tpb i{height:8px}.pfc .tpb small{text-align:right}
.pfc .bio{margin-top:12px;font-size:15px;line-height:1.6;color:#3a4260}
.n3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px;padding:12px 0;border-radius:14px;background:#f5f7fa}.n3 span{display:flex;flex-direction:column;align-items:center;font-size:12.5px;color:#6b7389;font-weight:700}.n3 b{font-size:18px;color:var(--ink);font-weight:900}

/* MY */
.myp{display:flex;align-items:center;gap:12px;width:100%;padding:18px 16px;background:#fff;text-align:left}.myp>div{flex:1;min-width:0}.myp b{display:flex;align-items:center;font-size:19px;font-weight:900}.myp small{display:block;font-size:13px;color:#6b7389;margin-top:2px}.myp>span{flex:none;font-size:13px;font-weight:700;padding:7px 11px;border-radius:9px;background:#f1f3f7;color:#3d4560}

button.vcard{width:calc(100% - 24px);text-align:left}button.vcard>svg{width:18px;height:18px;color:#7a5a20}

/* ===== v3 · 지도 슬라이드 메인 ===== */

.trk{display:flex;height:100%;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.sl{position:relative;flex:none;width:100%;height:100%;overflow:hidden;cursor:pointer}
.sl .map{position:absolute;inset:0;width:100%;height:100%}
.sl .pin{position:absolute;left:50%;top:40%;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;animation:pinD .7s cubic-bezier(.3,1.4,.5,1) both}

@keyframes pinD{from{transform:translate(-50%,-160%);opacity:0}}
.sl .pulse{position:absolute;left:50%;top:40%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:rgba(239,43,60,.35);animation:pls 1.8s ease-out infinite}

.sl .coord{position:absolute;left:10px;top:44px;display:flex;align-items:center;gap:3px;max-width:calc(100% - 20px);font-size:12px;font-weight:700;color:#1d2540;background:rgba(255,255,255,.92);border-radius:9px;padding:4px 9px;box-shadow:0 2px 6px rgba(10,30,80,.12);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}.sl .coord svg{width:14px!important;height:14px!important;color:#ef2b3c}
.slc{position:absolute;left:10px;right:10px;bottom:24px;display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:rgba(255,255,255,.97);box-shadow:0 8px 22px rgba(10,30,80,.22)}

.slc>div{flex:1;min-width:0}.slc small{display:flex;align-items:center;gap:4px;font-size:12px;color:#6b7389;white-space:nowrap;overflow:hidden}.slc small em{font-style:normal;font-weight:900;color:#fff;background:var(--rd);border-radius:5px;padding:0 5px}

.slc u{text-decoration:none;font-size:12px;padding:2px 7px;border-radius:6px}.slc>svg{width:18px!important;height:18px!important;color:#a3aabb;stroke-width:2.6}
.slh{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:900;color:#fff;background:rgba(10,35,80,.9);border-radius:11px;padding:4px 10px 4px 5px;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none}
.slh em{font-style:normal;font-size:12px;background:var(--rd);border-radius:7px;padding:1px 6px;animation:blk 1.4s infinite}@keyframes blk{50%{opacity:.6}}

.sdots{position:absolute;left:0;right:0;bottom:9px;display:flex;justify-content:center;gap:5px;pointer-events:none}.sdots i{width:6px;height:6px;border-radius:3px;background:rgba(10,35,80,.25);transition:all .3s}.sdots i.on{width:18px;background:var(--nv)}
